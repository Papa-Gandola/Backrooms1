<!DOCTYPE html>
<!-- Просмотр уровней без игры: /debug-world.html?index=2&x=10&z=10&yaw=0.5&light=1 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  #label { position: fixed; left: 12px; top: 10px; color: #d8c051;
           font: 16px Oswald, sans-serif; letter-spacing: 2px; text-shadow: 0 0 8px #000; z-index: 5; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="label"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { World } from './js/world.js';
import { makeFlashCookie } from './js/player.js';

const q = new URLSearchParams(location.search);
const index = q.get('index') || '0';
const data = await (await fetch(`/debug-level?index=${index}&seed=${q.get('seed') || 12345}`)).json();
document.getElementById('label').textContent = data.name;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.75;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 120);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.08 + data.ambient * 0.3;
scene.fog = new THREE.FogExp2(data.fog.color, data.fog.density);
scene.background = new THREE.Color(data.fog.color).multiplyScalar(0.25);
scene.add(new THREE.AmbientLight(0xffffff, data.ambient * 1.15));

const world = new World(scene);
world.build(data);

// ?prop=N — камера рядом с N-м предметом мебели
if (q.get('prop') !== null && world.propColliders?.length) {
  const pc = world.propColliders[parseInt(q.get('prop'), 10) % world.propColliders.length];
  q.set('x', pc.x + 1.9);
  q.set('z', pc.z + 1.4);
  q.set('yaw', Math.atan2(1.9, 1.4));
}

// камера: от спавна, из параметров или напротив предмета (?item=fuse&nth=0)
let px = q.get('x') ? parseFloat(q.get('x')) : data.spawn.x;
let pz = q.get('z') ? parseFloat(q.get('z')) : data.spawn.z;
let lookAt = null;
if (q.get('item')) {
  const wanted = data.items.filter(i => i.type === q.get('item'));
  const it = wanted[parseInt(q.get('nth') || '0', 10)] || wanted[0];
  if (it) {
    // встаём в ближайшую свободную клетку рядом
    const C = data.cell;
    const cells = Uint8Array.from(atob(data.cells), c => c.charCodeAt(0));
    const gx = Math.floor(it.x / C), gz = Math.floor(it.z / C);
    outer: for (const rr of [1, 2]) {
      for (const [dx, dz] of [[0, rr], [rr, 0], [0, -rr], [-rr, 0]]) {
        const cx = gx + dx, cz = gz + dz;
        if (cx < 0 || cz < 0 || cx >= data.w || cz >= data.h) continue;
        if (cells[cz * data.w + cx] === 1) continue;
        px = (cx + 0.5) * C; pz = (cz + 0.5) * C;
        break outer;
      }
    }
    lookAt = { x: it.x, z: it.z };
  }
}
let yaw;
if (lookAt) {
  yaw = Math.atan2(-(lookAt.x - px), -(lookAt.z - pz));
} else if (q.get('yaw') !== null) {
  yaw = parseFloat(q.get('yaw'));
} else {
  // смотрим в самый длинный открытый коридор
  const C = data.cell;
  let best = { d: -1, dx: 0, dz: -1 };
  for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    let d = 0;
    let gx = Math.floor(px / C), gz = Math.floor(pz / C);
    while (d < 40) {
      gx += dx; gz += dz;
      if (world.isWall(gx, gz)) break;
      d++;
    }
    if (d > best.d) best = { d, dx, dz };
  }
  yaw = Math.atan2(-best.dx, -best.dz);
}
camera.position.set(px, 1.7, pz);
camera.rotation.order = 'YXZ';
camera.rotation.y = yaw;

// фонарик по желанию
if (q.get('light') === '1') {
  const flash = new THREE.SpotLight(0xfff1d0, 55, 24, 0.48, 0.9, 1.25);
  if (q.get('cookie') !== '0') flash.map = makeFlashCookie();
  flash.castShadow = true;
  flash.shadow.mapSize.set(1024, 1024);
  flash.shadow.bias = -0.002;
  flash.position.copy(camera.position);
  const t = new THREE.Object3D();
  t.position.set(px - Math.sin(yaw) * 8, 1.2, pz - Math.cos(yaw) * 8);
  scene.add(t);
  flash.target = t;
  scene.add(flash);
  const spill = new THREE.SpotLight(0xffe6bf, 7, 14, 1.05, 0.95, 1.8);
  spill.position.copy(camera.position);
  spill.target = t;
  scene.add(spill);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
if (q.get('ao') !== '0') {
  const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
  gtao.blendIntensity = 0.9;
  composer.addPass(gtao);
}
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.5, 0.88));

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;
  world.update(dt, camera.position);
  composer.render();
}
requestAnimationFrame(loop);
window.__ready = true;
</script>
</body>
</html>
